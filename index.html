  if(t.closest('[data-act="otrf"]'))otBoot(true)});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.ots){S.ots=t.value;render(true)}});

/* кнопка «⟳ Обновить»: зашифрованная команда на сервер (канал как у ввода, тема tema_v) */
const OBNOV_COOLDOWN=420000,OBNOV_REREAD=400000;   // 27.11: прогон по кнопке 3–6 мин (добор МС до 5 мин)
function uuidOb(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}
  const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}
const MSK_OB=()=>new Date(Date.now()+3*3600e3).toISOString().slice(0,19).replace('T',' ');
async function kid16Ob(dk){const h=await crypto.subtle.digest('SHA-256',dk);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)}
async function envOb(dk,pl){const kid=await kid16Ob(dk),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await crypto.subtle.importKey('raw',dk,'AES-GCM',false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(pl))));
  return JSON.stringify({v:1,kid,iv:u8b64(iv),ct:u8b64(ct)})}
async function dkOb(){const c=RS.get('dk',null);if(!c)throw new Error('NEED_KEY');return b64u8(c.k)}
async function postOb(host,tema,body){try{const r=await fetch(host+'/'+tema,{method:'POST',body,headers:{'Content-Type':'text/plain'},cache:'no-store'});return r.ok}catch(e){return false}}
async function poslatObnovit(){
  const SV=D&&D.svyaz;if(!SV||!SV.hosts||!SV.hosts.length){toast('Обновление недоступно — нет канала');return}
  const tLast=+RS.get('obnovT',0);if(tLast&&Date.now()-tLast<OBNOV_COOLDOWN){toast('Подождите — недавно нажимали');return}
  const btn=$('#refBtn');if(!btn||btn.disabled)return;
  btn.disabled=true;btn.classList.add('spin');
  const lab=btn.querySelector('.rfd'),was=lab?lab.textContent:'';
  if(lab)lab.textContent='~7 мин';
  toast('Обновляю… ~7 мин',3600);
  try{
    const dk=await dkOb(),id=uuidOb(),kogda=MSK_OB();
    const inner=JSON.stringify({tip:'obnovit',kogda});
    const pl={id,chast:1,vsego:1,kto:'учёт',t:kogda,dannye:inner};
    const body=await envOb(dk,pl);
  const ok=(await Promise.all(SV.hosts.map(h=>postOb(h,SV.tema_v,body)))).some(x=>x);
    if(!ok)throw new Error('нет связи');
    RS.set('obnovT',Date.now());
    setTimeout(()=>{const ref=window.svcRefresh;
      (ref?ref():Promise.resolve()).finally(()=>{btn.classList.remove('spin');if(lab)lab.textContent=was||'Обновить';
        setTimeout(()=>{btn.disabled=false},Math.max(0,OBNOV_COOLDOWN-(Date.now()-(+RS.get('obnovT',0)))))});},OBNOV_REREAD);
  }catch(e){
    toast('Не отправилось на сервер');
    btn.classList.remove('spin');btn.disabled=false;if(lab)lab.textContent=was||'Обновить';
  }}
const _rb=$('#refBtn');if(_rb)_rb.addEventListener('click',()=>poslatObnovit());
/* ───────── листы снизу стопкой (как в «Рекламе»): «назад» — на лист ниже, потом закрыть ───────── */
const SHS=[];
function sheet(fn,push){if(!push)SHS.length=0;SHS.push({fn,y:0});drawSheet(true)}
function drawSheet(nw){const x=SHS[SHS.length-1];if(!x)return;let o=null;try{o=x.fn()}catch(e){o={t:'Не открылось',h:`<div class="note">${esc(e.message)}</div>`}}
  if(!o){closeSheet();return}
  const sh=$('#sheet');
  $('#shh').innerHTML=(SHS.length>1?'<button class="bk press" type="button" data-act="back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>':'')
    +`<div class="tt"><b id="shT">${o.t}</b>${o.s?`<span>${o.s}</span>`:''}</div>`;
  const b=$('#sbody');b.innerHTML=o.h;if(nw)b.scrollTop=0;else b.scrollTop=x.y||0;
  if(nw){sh.classList.remove('shn');void sh.offsetWidth;if(SHS.length>1)sh.classList.add('shn')}
  $('#shw').classList.add('on');document.body.style.overflow='hidden';if(o.after)o.after()}
function redraw(){const x=SHS[SHS.length-1];if(x){x.y=$('#sbody').scrollTop;drawSheet(false)}}
function closeSheet(){SHS.pop();if(SHS.length){drawSheet(false);return}hideSheet()}
function hideSheet(){SHS.length=0;$('#shw').classList.remove('on');document.body.style.overflow=''}
/* шторку можно смахнуть вниз — за ручку или шапку листа */
(()=>{let y0=null,dy=0;const sh=$('#sheet');
  const st=e=>{if(!e.target.closest('#grab,#shh')||e.target.closest('button'))return;y0=e.clientY;dy=0;sh.classList.add('drag');try{sh.setPointerCapture(e.pointerId)}catch(x){}};
  sh.addEventListener('pointerdown',st);
  sh.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=dy?`translateY(${dy}px)`:''});
  const en=()=>{if(y0==null)return;y0=null;sh.classList.remove('drag');sh.style.transform='';if(dy>90)hideSheet();dy=0};
  sh.addEventListener('pointerup',en);sh.addEventListener('pointercancel',en)})();

/* ───────── разделы ───────── */
const VIEWS={seg:vSeg,den:vDen,skl:vSkl,tab:vTab,esh:vEsh,sv:vSv,ras:vRas,den2:vDenOld,ob:vOb,ot:vOt};
const NAV=t=>t==='sv'||t==='ras'||t==='den2'?'esh':t==='ob'||t==='ot'?'tab':t;
function render(keep){if(!D)return;const v=$('#view'),y=scrollY;
  v.innerHTML=VIEWS[S.tab]();if(!keep){v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin')}
  $$('#tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===NAV(S.tab)?'true':'false'));
  const sb=$('#tabs [data-tab="seg"]'),n=(D.ne_tak||[]).length;let nb=sb.querySelector('.nb');
  if(n&&!nb){nb=document.createElement('i');nb.className='nb';sb.appendChild(nb)}if(nb){if(n)nb.textContent=n;else nb.remove()}
  if(keep)scrollTo(0,y);twFit()}
function go(t,keepScroll){if(!TABS.includes(t))return;const same=S.tab===t;S.tab=t;RS.set('tab',t);if(t==='tab')elBoot();render(same);if(!keepScroll&&!same)scrollTo({top:0})}
function openSh(k){if(/^(lenA|skS|skT|skD|skF|skN):/.test(k))return sheet(()=>shApp(k),SHS.length>0);
  if(k.startsWith('sch:'))return sheet(()=>shAcc(k.slice(4)),SHS.length>0);
  if(k.startsWith('op:'))return sheet(()=>shOp(k.slice(3)),SHS.length>0);
  if(k.startsWith('svk:'))return sheet(()=>shSv(k.slice(4)),SHS.length>0);
  if(k.startsWith('pro:'))return sheet(()=>shPro(k.slice(4)),SHS.length>0);
  if(k.startsWith('zad:'))return sheet(()=>shZad(k.slice(4)),SHS.length>0);
  if(k.startsWith('uch:'))return sheet(()=>shUch(k.slice(4)),SHS.length>0);
  if(k.startsWith('obr:'))return sheet(()=>shOb(k.slice(4)),SHS.length>0);
  if(/^ot([dszfv]|sv):/.test(k))return sheet(()=>shOt(k),SHS.length>0);
  if(k.startsWith('elt:'))return sheet(()=>shElTbl(k.slice(4)),SHS.length>0);
  if(k.startsWith('els:')){const [tk,si]=k.slice(4).split('|');return sheet(()=>shElGrid(tk,+si),true)}
  sheet(()=>shKey(k),false)}
function ntGo(i){const x=(D.ne_tak||[])[i];if(!x)return;
  if(x.kod){go('sv');openSh('svk:'+x.kod);return}
  if(x.vid==='scheta'){go('den');openSh('ml');return}
  if(x.vid==='klass'){go('den');openSh('bezkl');return}
  if(x.vid==='kal'){go('den');openSh('kal');return}
  if(x.vid==='vb'){openSh('vb');return}
  go(x.kuda==='dengi'?'den':x.kuda==='segodnya'?'seg':x.kuda==='ras'?'ras':'sv')}
document.addEventListener('click',e=>{const t=e.target;
  const tb=t.closest('#tabs [data-tab]');if(tb){go(tb.dataset.tab);return}
  const th=t.closest('th[data-ts]');if(th){const [id,k]=th.dataset.ts.split('|');tblClick(id,k);return}
  const a=t.closest('[data-act]');
  if(a){const k=a.dataset.act;
    if(k==='cols'){openCols(a.dataset.id);return}
    if(k==='close'){hideSheet();return}
    if(k==='back'){closeSheet();return}
    if(k==='sch'||k==='op'||k==='pro'){openSh(k+':'+a.dataset.id);return}
    if(k==='lensch'){S.len=String(a.dataset.id);RS.set('len',S.len);hideSheet();go('den2',true);requestAnimationFrame(()=>{const c=$('#cLen'),hd=c&&c.previousElementSibling,tb=$('#tabs');if(hd)scrollTo({top:Math.max(0,hd.getBoundingClientRect().top+scrollY-(tb?tb.getBoundingClientRect().bottom:0)-8)})});return}
    if(k==='svk'){openSh('svk:'+a.dataset.kod);return}
    if(k==='zad'){openSh('zad:'+a.dataset.z);return}
    if(k==='uch'){openSh('uch:'+a.dataset.z);return}
    if(k==='elrf'){elBoot(true);return}
    if(k==='els'){openSh('els:'+a.dataset.ek+'|'+a.dataset.ei);return}}
  const sg=t.closest('[data-seg] button');if(sg&&sg.closest('#view')){const id=sg.parentNode.dataset.seg;if(id==='schf'){S.sch=sg.dataset.v;RS.set('schf',S.sch);render(true)}if(id==='rasf'){S.ras=sg.dataset.v;RS.set('rasf',S.ras);render(true)}return}
  const g=t.closest('[data-go]');if(g){if(g.dataset.obv)S.obv=g.dataset.obv;go(g.dataset.go);return}
  const s=t.closest('[data-sh]');if(s){openSh(s.dataset.sh);return}
  const n=t.closest('[data-nt]');if(n){ntGo(+n.dataset.nt);return}});
$('#scrim').addEventListener('click',hideSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHS.length){e.preventDefault();closeSheet()}});
let rsT=0;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{twFit();placeTabs()},200)});placeTabs();

/* ───────── темы (общие с остальными сервисами: авто, светлая, тёмная, «Космос»), «глаз» ───────── */
const THL=[['auto','Как в системе','Обычные'],['light','Светлая','Обычные'],['dark','Тёмная','Обычные'],['space','Космос','Космос']];
function tcSync(){const c=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();if(c)$('#tc').setAttribute('content',c)}
function applyTheme(t,user){const R=document.documentElement;if(!THL.some(x=>x[0]===t))t='auto';
  if(t==='auto')delete R.dataset.theme;else R.dataset.theme=t;RS.set('theme',t);if(user&&window.svcTheme)try{svcTheme(6,t)}catch(e){}tcSync()}
if(window.svcPicker)svcPicker({btn:'#thBtn',list:THL,cur:RS.get('theme','auto'),onPick:t=>applyTheme(t,true)});
else $('#thBtn').addEventListener('click',()=>{const i=THL.findIndex(x=>x[0]===RS.get('theme','auto'));applyTheme(THL[(i+1)%THL.length][0],true)});
function eyeSync(){const on=RS.get('eye',1)!==0,b=$('#eyeBtn');document.documentElement.dataset.eye=on?'1':'0';b.setAttribute('aria-pressed',on?'false':'true');
  b.title=on?'Спрятать суммы':'Показать суммы';b.setAttribute('aria-label',b.title);
  b.innerHTML=on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.6A9.7 9.7 0 0 1 12 5.5C18 5.5 21.5 12 21.5 12a17 17 0 0 1-3.2 4M6.2 6.9C3.9 8.6 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'}
$('#eyeBtn').addEventListener('click',()=>{RS.set('eye',RS.get('eye',1)===0?1:0);eyeSync()});
eyeSync();

/* ───────── старт: только личная ссылка (ключ данных в части адреса после #). Пароля нет: без ключа — только форма входа ───────── */
const LOCKF='<form class="card" id="pwf"><div class="lgo"><svg viewBox="0 0 32 32" width="38" height="38" fill="none"><path d="M11 25V7h6.4a5 5 0 0 1 0 10H8.6M8.6 21h10" stroke="#ffd166" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.5" cy="6.5" r="2.6" fill="#fff59d"/></svg></div>'
  +'<h1>Учёт</h1><div class="lbl">Введите пароль — или вставьте личную ссылку.</div>'
  +'<input class="inp" id="lnk" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="пароль или ссылка" aria-label="Пароль или личная ссылка"><div id="pwerr"></div>'
  +'<button class="btn press" id="pwgo" type="submit">Открыть</button></form>';
/* ключ из ссылки (#k=… от deploy.py link) — в память устройства; из адреса стираем (часть после # на сервер не уходит) */
function keyFrom(t){const m=String(t||'').match(/k=([A-Za-z0-9_-]{40,})/);if(!m)return false;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/'),o=JSON.parse(new TextDecoder().decode(b64u8(b+'==='.slice((b.length+3)%4))));
    if(o&&o.k&&o.id&&b64u8(o.k).length===32){RS.set('dk',{id:o.id,k:o.k});return true}}catch(e){}
  return false}
function hashKey(){if(!/k=/.test(location.hash))return;if(keyFrom(location.hash)){try{localStorage.removeItem('svc.buh')}catch(e){}if(window.svcBuh)svcBuh(false)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}}
function lockOn(msg){const L=$('#lock');if(!$('#pwf'))L.innerHTML=LOCKF;L.hidden=false;document.body.classList.add('locked');
  $('#view').innerHTML='';$('#pwerr').textContent=msg||'';$('#pwgo').disabled=false;setTimeout(()=>{const p=$('#lnk');if(p)p.focus()},60)}
async function boot(){
  if(!RS.get('dk',null)){let fp='';try{fp=JSON.parse(localStorage.getItem('pan.fp')||'""')}catch(e){}
    if(fp&&await keyByPass(fp).catch(()=>false)){if(window.svcBuh)svcBuh(true)}else{lockOn('');return}}   // ключа на устройстве нет — данные даже не скачиваем
  try{D=await load(false)}catch(e){
    if(e.message==='NEED_KEY'||e.message==='BAD_KEY'){lockOn(e.message==='BAD_KEY'?'Ссылка устарела — нужна новая личная ссылка':'');return}
    $('#view').innerHTML=`<div class="empty"><b>Не открылось</b>${e.message==='NO_GZ'?'Этот браузер слишком старый. Обновите его или откройте в другом.':esc(e.message)}<br><br><button class="btn sm gray press" type="button" onclick="location.reload()">Повторить</button></div>`;return}
  document.body.classList.remove('locked');document.documentElement.classList.remove('nokey');$('#lock').hidden=true;$('#lock').innerHTML='';render();applyTheme(RS.get('theme','auto'))}
$('#lock').addEventListener('submit',e=>{e.preventDefault();const t=$('#lnk').value.trim();if(!t)return;
  $('#pwgo').disabled=true;$('#pwerr').textContent='';
  const isL=/k=/.test(t);
  (isL?Promise.resolve(keyFrom(t)):keyByPass(t).catch(()=>false)).then(ok=>{
    if(!ok){$('#pwgo').disabled=false;$('#pwerr').textContent=isL?'Это не личная ссылка «Учёта»':'Пароль не подошёл';return}
    if(!isL){try{localStorage.setItem('pan.fp',JSON.stringify(t))}catch(e){}}   // 21.11 один пароль на Учёт и Панель: Панель откроется без ввода
    if(window.svcBuh)svcBuh(!isL);   // 21.11: вошли паролем бухгалтера — в списке сервисов только Панель и Учёт; личной ссылкой — все
    boot().then(()=>{if(!D)$('#pwerr').textContent=isL?'Ссылка не подошла':'Пароль не подошёл'})})});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='lenS'){S.len=e.target.value;RS.set('len',S.len);render(true)}});
/* «потянуть вниз — обновить» (общая шапка servisy\svc.py): данные заново, страница на месте */
window.svcRefresh=async()=>{try{D=await load(true);if(S.tab==='tab')elBoot(true);render(true);if(SHS.length)redraw();toast('Обновлено · снимок '+dmt(D.at))}catch(e){toast('Не обновилось: '+(e.message==='NEED_KEY'?'нужна личная ссылка':e.message))}};
if(window.svcBack)svcBack({pop:[()=>{if(SHS.length){closeSheet();return true}return false}],main:()=>{if(S.tab==='sv'||S.tab==='ras'||S.tab==='den2'){go('esh');return true}if(S.tab==='ob'||S.tab==='ot'){go('tab');return true}if(S.tab!=='seg'){go('seg');return true}return false},home:()=>{}});
window.UCH={get D(){return D},S,calc,go,openSh,hideSheet,closeSheet,get SHS(){return SHS},porog,TBL,tblSt,render,lentaRows};   // для проверок test_page.py
/* 28.11 «← Учёт» со «Склада» страницы ввода: адрес ../#skl открывает нужный раздел */
(()=>{const h=location.hash.slice(1);if(h&&!/k=/.test(h)&&TABS.includes(h)){S.tab=h;RS.set('tab',h);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}})();
hashKey();boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/uchet/sw.js',{scope:'/uchet/'}).catch(()=>{});

})();
