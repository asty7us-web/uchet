/*SVC:CSS*/
/* выбор сервиса (servisy\svc.py — править там): кнопка «значок + название ⌄», под ней список трёх сервисов */
.svc{position:relative;flex:none;min-width:0}
/* шрифт задаю обёртке, кнопка его наследует (button{font:inherit} страниц) — так темы Юнитки (.brand) и Склеек (.brand b) по-прежнему перекрашивают название */
:where(.svc){font:700 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.svc-btn{display:inline-flex;align-items:center;gap:9px;height:40px;margin:0 0 0 -6px;padding:0 9px 0 5px;border:0;border-radius:13px;background:transparent;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background-color .2s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.svc-btn .svc-nm{font:inherit;letter-spacing:inherit}
/* подложка — в цвет текста шапки (в игровых темах шапка цветная, а название белое) */
@media (hover:hover){.svc-btn:hover{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}}
.svc-btn:active{transform:scale(.95);transition-duration:.12s}
.svc-btn[aria-expanded="true"]{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}
.svc-btn .svc-ic{width:30px;height:30px;border-radius:9px}
.svc-chev{width:16px;height:16px;flex:none;opacity:.55;margin-left:-3px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-btn[aria-expanded="true"] .svc-chev{transform:rotate(180deg)}
/* значок (12.11, Андрей: «значок панели крутой, сделай для остальных свои»): тёмная плитка своего оттенка, яркая линия своего цвета,
   жёлтая точка; блик сверху, цветное свечение; при наведении и открытии — лёгкий наклон */
.svc-ic{display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:#fff;font-style:normal;line-height:1;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.14),0 3px 9px -2px var(--svc-glow,rgba(0,0,0,.3));
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 75% at 28% 6%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.svc-ic svg{position:relative;width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.svc-ic.u{--svc-glow:rgba(110,235,130,.5);background:linear-gradient(145deg,#4a6b55 0%,#1e3226 52%,#0a130d 100%)}
.svc-ic.s{--svc-glow:rgba(190,140,255,.5);background:linear-gradient(145deg,#655690 0%,#2b2247 52%,#100c1d 100%)}
.svc-ic.k{--svc-glow:rgba(255,160,70,.5);background:linear-gradient(145deg,#80603f 0%,#3b2b1c 52%,#170f08 100%)}
.svc-ic.z{--svc-glow:rgba(100,185,255,.5);background:linear-gradient(145deg,#456690 0%,#1d2d47 52%,#0a111d 100%)}
.svc-ic.p{--svc-glow:rgba(30,34,48,.6);background:linear-gradient(145deg,#5b6275 0%,#262a36 52%,#0c0d12 100%)}
.svc-ic.r{--svc-glow:rgba(255,120,160,.5);background:linear-gradient(145deg,#8a4a63 0%,#3e1c2b 52%,#190a11 100%)}
.svc-ic.c{--svc-glow:rgba(255,205,90,.5);background:linear-gradient(145deg,#7d6b34 0%,#362c12 52%,#141006 100%)}
@media (hover:hover){.svc-btn:hover .svc-ic,.svc-it:hover .svc-ic{transform:rotate(-8deg) scale(1.06)}}
.svc-btn[aria-expanded="true"] .svc-ic{transform:rotate(-8deg) scale(1.06)}
.svc-menu.on .svc-it .svc-ic{animation:svc-ico .6s cubic-bezier(.34,1.56,.64,1) both}
.svc-menu.on .svc-it:nth-child(3) .svc-ic{animation-delay:.05s}.svc-menu.on .svc-it:nth-child(4) .svc-ic{animation-delay:.1s}.svc-menu.on .svc-it:nth-child(5) .svc-ic{animation-delay:.15s}.svc-menu.on .svc-it:nth-child(6) .svc-ic{animation-delay:.2s}.svc-menu.on .svc-it:nth-child(7) .svc-ic{animation-delay:.25s}.svc-menu.on .svc-it:nth-child(8) .svc-ic{animation-delay:.3s}
@keyframes svc-ico{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.svc-menu{position:absolute;z-index:300;top:calc(100% + 8px);left:-6px;width:min(318px,calc(100vw - 20px));padding:6px;border-radius:20px;
  background:var(--svc-card);color:var(--svc-ink);box-shadow:0 0 0 .5px var(--svc-line),0 18px 50px -12px rgba(0,0,0,.34),0 4px 12px -4px rgba(0,0,0,.12);
  transform-origin:24px -6px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.92);pointer-events:none;
  transition:opacity .16s ease,transform .26s cubic-bezier(.4,0,.6,1),visibility 0s linear .26s}
.svc-menu.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s ease,transform .5s cubic-bezier(.22,1.3,.36,1),visibility 0s}
.svc-menu.gone{transition:none!important;opacity:0!important;visibility:hidden!important}
.svc-cap{padding:9px 12px 6px;font:700 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--svc-ink3)}
.svc-it[hidden]{display:none!important}
.svc-it{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:inherit;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.svc-it .svc-ic{width:42px;height:42px;border-radius:12px}
.svc-tx{min-width:0;flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svc-tx b{display:block;font-size:15.5px;font-weight:650;line-height:1.2;letter-spacing:-.005em}
.svc-tx small{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--svc-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.svc-it:hover{background:var(--svc-hover)}}
.svc-it:active{transform:scale(.97);background:var(--svc-hover);transition-duration:.1s}
.svc-it[aria-current]{background:var(--svc-acc-soft)}
.svc-it[aria-current] b{color:var(--svc-acc)}
.svc-ok{width:20px;height:20px;flex:none;color:var(--svc-acc)}
.svc-sp{width:18px;height:18px;flex:none;border-radius:50%;border:2.2px solid var(--svc-line);border-top-color:var(--svc-acc);opacity:0;transition:opacity .2s}
.svc-it.go .svc-sp{opacity:1;animation:svc-spin .7s linear infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
.svc-menu.on .svc-it{animation:svc-row .5s cubic-bezier(.22,1.2,.36,1) both}
.svc-menu.on .svc-it:nth-child(3){animation-delay:.035s}.svc-menu.on .svc-it:nth-child(4){animation-delay:.07s}.svc-menu.on .svc-it:nth-child(5){animation-delay:.105s}.svc-menu.on .svc-it:nth-child(6){animation-delay:.14s}.svc-menu.on .svc-it:nth-child(7){animation-delay:.175s}.svc-menu.on .svc-it:nth-child(8){animation-delay:.21s}
@keyframes svc-row{from{opacity:0;transform:translateY(-6px)}}
/* выбор темы — как в Юнитке (Андрей 29.10: «как в юнитке выбор везде тем формат»): кнопка «значок + название темы», под ней список
   с кружками и группами «Весёлые» / «Спокойные». Юнитка рисует свой (он образец), Склейки и Конкуренты — svcPicker() отсюда */
.svt{position:relative;flex:none}
.svt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--svc-line);border-radius:10px;
  background:var(--svc-card);color:var(--svc-ink2);font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.svt-btn:active{transform:scale(.94)}
.svt-btn svg{width:18px;height:18px;flex:none;display:block}
@media (max-width:860px){.svt-btn span{display:none}}
.svt-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-height:calc(100vh - 100px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--svc-card);color:var(--svc-ink);border:1px solid var(--svc-line);box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
  font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform-origin:top right;animation:svt-in .24s cubic-bezier(.22,1,.36,1)}

.svt-menu .sw{width:20px;height:20px;flex:none;display:block}
.svt-menu .tgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--svc-ink3);padding:8px 10px 2px;border-top:1px solid var(--svc-line);margin-top:4px}
/* переход между сервисами: шапка и кнопка сервиса остаются на месте, остальное мягко проявляется */
@view-transition{navigation:auto}
.svc-hdr{view-transition-name:svc-hdr}
#svcBtn{view-transition-name:svc-btn}
::view-transition-group(svc-hdr),::view-transition-group(svc-btn){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(svc-hdr){overflow:clip}
::view-transition-old(svc-hdr),::view-transition-new(svc-hdr){animation-duration:.3s}
::view-transition-old(svc-btn),::view-transition-new(svc-btn){animation-duration:.32s;width:auto;height:auto}   /* название не растягивается, просто сменяется */
::view-transition-old(root){animation:svc-out .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:svc-in .42s cubic-bezier(.16,1,.3,1) both}
@keyframes svc-out{to{opacity:0}}
@keyframes svc-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){@keyframes svc-in{from{opacity:0}}}
/* 18.11 Андрей «во всех сервисах»: «потянуть вниз — обновить» как в айфоне (у «Рекламы» свой такой же, reklama_wb) */
html,body{overscroll-behavior-y:contain}
.svc-ptr{position:fixed;left:50%;top:0;z-index:150;width:40px;height:40px;margin-left:-20px;display:grid;place-items:center;pointer-events:none;
  color:var(--svc-ink2,#8a8a8e);opacity:0;transform:translate3d(0,var(--py,-46px),0) scale(var(--ps,1))}
.svc-ptr .pt{opacity:0;transition:opacity .12s ease}
.svc-ptr .pt.on{opacity:.9}
.svc-ptr.spin .pt.on{opacity:var(--o)}
.svc-ptr svg{transition:transform .2s cubic-bezier(.32,.72,0,1)}
.svc-ptr.rdy svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform:scale(1.08)}
.svc-ptr.go{transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .25s ease}
.svc-ptr.out{--ps:.55}
.svc-ptr.spin svg{animation:svc-rot .8s steps(8) infinite}
@keyframes svc-rot{to{transform:rotate(360deg)}}
html.svc-ptrout body>main{opacity:.4;transition:opacity .16s ease}
html.svc-ptrin body>main{animation:svc-ptrin .4s cubic-bezier(.32,.72,0,1) both}

/*/SVC:CSS*/
/* ── шапка и разделы кнопками сверху (Андрей 18.11: «сверху как раз поставь такими кнопками») ── */
.hdr{position:sticky;top:0;z-index:60;background:var(--hdr);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 6px) max(14px,env(safe-area-inset-left)) 8px max(14px,env(safe-area-inset-right))}
.hrow{display:flex;align-items:center;gap:8px;height:44px;max-width:1100px;margin:0 auto}
.hsp{flex:1}

.ib svg{width:20px;height:20px}
.ib.rfb{display:inline-flex;flex-direction:column;gap:1px;width:46px;height:38px;padding:0;font-weight:700;font-size:9px;line-height:1;color:var(--ink2)}
.ib.rfb svg{width:16px;height:16px}.ib.rfb .rfd{font:inherit;font-size:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.rfb.spin svg{animation:uch-rot .9s linear infinite}

@keyframes uch-rot{to{transform:rotate(360deg)}}
@media (min-width:700px){.ib.rfb{flex-direction:row;width:auto;gap:6px;padding:0 10px 0 8px;font-size:12px;font-weight:650}.ib.rfb svg{width:17px;height:17px}.ib.rfb .rfd{font-size:12px}}
.tabs{display:flex;gap:4px;max-width:1100px;margin:6px auto 0;padding:3px;border-radius:14px;background:var(--fill)}
.tabs button{flex:1;border:0;background:none;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:14.5px;color:var(--ink2);cursor:pointer;
  transition:color .2s,background-color .25s var(--ease),box-shadow .25s}
.tabs button svg{width:18px;height:18px;flex:none}
.tabs button[aria-current="true"]{background:var(--thumb);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tabs button[aria-current="true"] svg{color:var(--acc)}
.tabs .nb{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px}
:root[data-theme="space"] .tabs button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 30%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 50%,transparent)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .tabs button[aria-current="true"]{background:#3a3a3e}}
:root[data-theme="dark"] .tabs button[aria-current="true"]{background:#3a3a3e}
main{max-width:1100px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
.fr{font-size:12.5px;color:var(--ink3);margin:2px 4px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fr i{font-style:normal;color:var(--ink2)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1);padding:16px;margin-bottom:12px}
button.card{display:block;width:100%;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.muted{color:var(--ink3)}.s2{color:var(--ink2)}
.cap{font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chev{width:18px;height:18px;flex:none;color:var(--ink3)}
.cap .chev{margin-left:auto}
.nt .chev,.sv .chev,.dl .chev{align-self:center}
.big{font:750 34px/1.08 var(--fd);letter-spacing:-.025em;margin:6px 0 2px}
.mid{font:700 22px/1.15 var(--fd);letter-spacing:-.02em;margin:4px 0 1px}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.note{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.4}
.ist{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink3);background:var(--fill2);border-radius:7px;padding:2px 7px;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--fill2);border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink2)}
.pill b{color:var(--ink);font-weight:650}
.bdg{display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px;line-height:1.35;white-space:nowrap}
.bdg.ok{background:var(--good-soft);color:var(--good)}.bdg.warn{background:var(--warn-soft);color:var(--warn)}.bdg.bad{background:var(--bad-soft);color:var(--bad)}.bdg.gray{background:var(--fill);color:var(--ink3)}
/* «Сегодня»: не больше четырёх плиток (поправки к показу, 33) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .card{margin:0}
.tiles .w2{grid-column:span 2}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles .w4{grid-column:span 4}}
@media (max-width:899px){.tiles .w4{grid-column:span 2}}
.tile .mid{font-size:21px}
.row2{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.row2>div{min-width:0}
.row2 .k{font-size:12.5px;color:var(--ink3)}
.row2 .v{font:700 18px/1.2 var(--fd);letter-spacing:-.015em}
/* «Деньги»: строки сверху вниз — свои, не обновлялось, обещано, свободно, долги без даты, площадки, кредитки, счета, лента, приёмки */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two>div{background:var(--fill2);border-radius:14px;padding:10px 12px;min-width:0}
.two .k{font-size:12.5px;color:var(--ink3)}
.two .v{font:700 20px/1.2 var(--fd);letter-spacing:-.015em;margin-top:2px}
.two .s{font-size:12px;color:var(--ink3);margin-top:1px}
.line{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:16px;box-shadow:var(--sh1);padding:12px 14px;margin-bottom:10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-weight:650;font-size:14.5px}
.line .t span{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.line .v{font:700 16px/1.2 var(--fd);white-space:nowrap}
.line.gray{background:var(--fill2);box-shadow:none}
.line.gray .v,.line.gray .t b{color:var(--ink2)}
.line.small{padding:9px 14px}
.line.small .t b{font-size:13.5px;font-weight:600}
.line.static{cursor:default}
.line .chev{width:18px;height:18px;color:var(--ink3);flex:none}
.dl{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.dl button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 0;border-bottom:.5px solid var(--line2);text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.dl button:last-child{border-bottom:0}
.dl .t{flex:1;min-width:0}.dl .t b{display:block;font-weight:600}.dl .t span{display:block;font-size:12.5px;color:var(--ink3)}
.dl .v{font-weight:700;white-space:nowrap}
.hrw{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;flex-wrap:wrap}
.hrw h3{margin:0;flex:1;white-space:nowrap;font:700 18px/1.2 var(--fd);letter-spacing:-.015em}
.hrw .muted{font-size:12.5px}
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--thumb);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{border:0;background:var(--fill);border-radius:999px;height:32px;padding:0 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
/* «Не так» и «Сверка» */
.nt{display:flex;flex-direction:column;gap:0;margin-top:6px}
.nt button{display:flex;gap:10px;align-items:flex-start;border:0;background:none;padding:9px 0;border-bottom:.5px solid var(--line2);text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.nt button:last-child{border-bottom:0}
.nt .ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.nt .ic.bad{background:var(--bad-soft);color:var(--bad)}.nt .ic.warn{background:var(--warn-soft);color:var(--warn)}.nt .ic.ok{background:var(--good-soft);color:var(--good)}
.nt .t{flex:1;min-width:0}.nt .t b{display:block;font-weight:650;font-size:14.5px}.nt .t span{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px;overflow-wrap:anywhere}
.empty1{display:flex;gap:10px;align-items:center;color:var(--ink3);font-size:13.5px;margin-top:8px}
.empty1 .ic{width:22px;height:22px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sv,button.card.sv{display:flex;gap:12px;align-items:flex-start}
.sv .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
.sv .ic.ok{background:var(--good-soft);color:var(--good)}.sv .ic.bad{background:var(--bad-soft);color:var(--bad)}.sv .ic.gray{background:var(--fill);color:var(--ink3)}
.sv .t{flex:1;min-width:0}.sv .t b{display:block;font-weight:650;font-size:15px}.sv .t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.sv .t small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.svl{display:grid;gap:10px}
@media (min-width:900px){.svl{grid-template-columns:1fr 1fr}}
.svl .card{margin:0}
.kod{font:600 12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink3);background:var(--fill2);border-radius:6px;padding:1px 6px}
/* «свободно» меньше нуля — плитка красноватая (цвет — по первой цифре: если ничего не придёт) */
.card.neg{background:color-mix(in srgb,var(--bad) 7%,var(--card));box-shadow:var(--sh1),inset 0 0 0 1px color-mix(in srgb,var(--bad) 28%,transparent)}
/* лента в два ряда (образец — лист «отчет» «Наличных АБ»): остаток виден без прокрутки вбок */
.lenta{padding:2px 14px}
.lr{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 0;border-bottom:.5px solid var(--line2);cursor:pointer;font:inherit;color:inherit}
.lr:last-child{border-bottom:0}
.l1,.l2{display:flex;align-items:baseline;gap:10px;min-width:0}
.lo{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.la{flex:none;font-weight:700;font-size:15px;white-space:nowrap}
.l2{margin-top:3px;font-size:12.5px;color:var(--ink3)}
.lm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm i.chat{font-style:normal;font-size:11px;font-weight:650;padding:1px 6px;border-radius:8px;background:rgba(245,158,11,.16);color:#b45309}
.lb{flex:none;white-space:nowrap}.lb b{color:var(--ink2);font-weight:650}
.dl>div.zr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line2)}
.dl>div.zr:last-child{border-bottom:0}
.empty1.nl .ic{background:var(--fill);color:var(--ink3)}
/* без ключа — ничего, кроме формы входа */
body.locked .hdr,body.locked main,html.nokey .hdr,html.nokey main{display:none}
#lnk{font-size:15px;font-weight:500}
/* формула «свободно» */
.fm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;font-size:15px;margin:4px 0 10px}
.fm .v{text-align:right;font-weight:650;white-space:nowrap}
.fm .tot{border-top:.5px solid var(--line);padding-top:8px;font-weight:750}
.stp{display:flex;align-items:center;gap:8px;margin:6px 0 4px}

/* таблицы (как в «Рекламе», reklama_wb\src\d_tabl.js) */
.tw{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1);overflow:auto;-webkit-overflow-scrolling:touch}
.tws{max-height:var(--twh,70vh)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:.5px solid var(--line2)}
th{font-size:11.5px;font-weight:650;color:var(--ink3);letter-spacing:.02em;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;z-index:1;white-space:normal;line-height:1.15;vertical-align:bottom;max-width:110px}
.tws th{box-shadow:inset 0 -1px 0 var(--line)}
th[aria-sort]:after,th[data-s2]:after{content:"";display:inline-block;width:0;height:0;margin-left:4px;vertical-align:middle;border:5px solid transparent}
th[aria-sort="descending"]:after{border-top-color:var(--acc);margin-top:4px}
th[aria-sort="ascending"]:after{border-bottom-color:var(--acc);margin-bottom:4px}
th[aria-sort]{color:var(--ink)}th[data-s2]{color:var(--ink2)}
th[data-s2="d"]:after{border-top-color:var(--ink3);margin-top:4px}th[data-s2="a"]:after{border-bottom-color:var(--ink3);margin-bottom:4px}
th .sn{font-style:normal;font-size:9.5px;font-weight:700;color:var(--acc);margin-left:2px;vertical-align:top}
th[data-s2] .sn{color:var(--ink3)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
th:first-child{z-index:3}
td .tn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
td small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;overflow:hidden;text-overflow:ellipsis}
/* строка источника счёта (Финтабло · Дзен-мани, 20.11): переносится, точка — цвет состояния */
td small.src,.kv .src{white-space:normal;line-height:1.3;margin-top:2px;min-width:150px}
.kv .src{display:block;text-align:left;font-weight:500}
.kv .v small.src{font-size:12px;color:var(--ink3)}
.src .dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--ink3)}
.src .dt.ok{background:var(--good)}.src .dt.warn{background:var(--warn)}.src .dt.bad{background:var(--bad)}
td.wrap{white-space:normal;min-width:180px;max-width:320px;text-align:left;font-size:13px;color:var(--ink2)}
td.l{text-align:left}
tbody tr{cursor:pointer}
@media (hover:hover){tbody tr:hover td{background:color-mix(in srgb,var(--fill2) 100%,var(--card))}}
.tnote{font-size:12px;line-height:1.4;margin:8px 4px 0;color:var(--ink3)}
.sheet .tw{background:var(--card2);box-shadow:none;border-radius:16px}
.sheet .tws{max-height:min(62dvh,560px)}
.sheet .tw th,.sheet .tw td:first-child{background:var(--card2)}
/* лист снизу (как в «Рекламе») */
.shw{position:fixed;inset:0;z-index:100;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.36);opacity:0;transition:opacity .22s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;max-width:760px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--sh2);transform:translateY(102%);
  transition:transform .26s var(--ease);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.shw:not(.on) .sheet{visibility:hidden;transition:transform .26s var(--ease),visibility 0s linear .26s}
.shw.on{pointer-events:auto}.shw.on .scrim{opacity:1;transition:opacity .28s var(--out)}.shw.on .sheet{transform:none;visibility:visible;transition:transform .32s var(--out),visibility 0s}
.sheet.drag{transition:none!important}
.grab{padding:9px 0 3px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--bar)}
.shh{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;flex:none;touch-action:none}
.shh .tt{flex:1;min-width:0}
.shh .tt b{display:block;font:700 19px/1.2 var(--fd);letter-spacing:-.02em;overflow-wrap:anywhere}
.shh .tt span{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
.shh .bk{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.shh .bk svg{width:16px;height:16px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 22px;overscroll-behavior:contain}
.sheet.shn .shh .tt,.sheet.shn>.sbody{animation:shIn .26s var(--out) backwards}
@keyframes shIn{from{opacity:0;transform:translateX(18px)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;margin:4px 0 8px}
.kv .k{color:var(--ink3)}.kv .v{text-align:right;font-weight:600;overflow-wrap:anywhere}
.zmkv{grid-template-columns:minmax(0,46%) 1fr}.zmkv .v{text-align:left}.zmkv .v small{display:block;font-size:12px;font-weight:500;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 18px;border:0;border-radius:14px;background:var(--acc);color:var(--on-acc);font-weight:650;font-size:16px;cursor:pointer;width:100%}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn.sm{height:36px;font-size:14px;border-radius:11px;padding:0 13px;width:auto}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--bar);border:0;cursor:pointer;flex:none;transition:background-color .25s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .32s var(--spring)}
.sw[aria-checked="true"]{background:var(--good)}.sw[aria-checked="true"]:after{transform:translateX(20px)}
.opt{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line2)}
.opt:last-child{border-bottom:0}
.opt div{flex:1;min-width:0}.opt b{display:block;font-weight:600;font-size:15px}.opt span{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.colr{gap:8px;touch-action:pan-y}
.colr.drg{position:relative;z-index:5;background:var(--card);box-shadow:var(--sh2);border-radius:12px}
.dh{width:22px;flex:none;text-align:center;color:var(--ink3);cursor:grab;font-style:normal;touch-action:none}
.dh0{visibility:hidden}
.ssel{flex:none;height:36px;max-width:44vw;border:0;border-radius:10px;background:var(--fill);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
.mvb{width:36px;height:34px;border:0;border-radius:10px;background:var(--fill);font-size:16px;font-weight:700;cursor:pointer;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);background:rgba(28,28,30,.94);color:#fff;font-weight:600;font-size:14px;padding:11px 16px;border-radius:14px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--spring);z-index:200;width:max-content;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--ink3);padding:48px 20px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font:700 19px var(--fd);margin-bottom:6px}
/* замок: окно пароля существует, только пока спрашиваем (Андрей 12.11: «выскакивает в поиске пароль постоянно») */
.lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:20px}
.lock .card{width:min(360px,100%);text-align:center;padding:26px 22px}
.lock h1{font:700 24px var(--fd);margin:10px 0 4px}
.lock .lbl{color:var(--ink3);font-size:14px;margin-bottom:14px}
.lock #pwerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.lock .lgo{width:60px;height:60px;border-radius:17px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(145deg,#7d6b34,#362c12 52%,#141006)}
.inp{width:100%;height:48px;border:0;border-radius:13px;background:var(--fill);padding:0 14px;font-size:19px;font-weight:650;outline:0;margin-bottom:6px}
.inp:focus{box-shadow:0 0 0 2px var(--acc)}
.sk{height:60vh;border-radius:var(--r);background:linear-gradient(90deg,var(--fill2),var(--fill),var(--fill2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* «Таблицы учёта» — сетка как в Гугле */
.elmeta{margin-bottom:8px}
.elfind{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.elfind .inp{flex:1;min-width:140px;margin:0;font-size:13px;padding:8px 10px}
.elcnt{font-size:12px;color:var(--ink3)}
.elscr{overflow:auto;-webkit-overflow-scrolling:touch;max-height:min(70vh,560px);border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.eltbl{border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.35;color:var(--tx);min-width:max-content}
.eltbl th,.eltbl td{border-right:.5px solid var(--line2);border-bottom:.5px solid var(--line2);padding:4px 7px;max-width:16em;word-break:break-word;vertical-align:top;background:var(--card)}
.eltbl th.elth,.eltbl td.elrn{position:sticky;background:linear-gradient(var(--fill2),var(--fill2)),linear-gradient(var(--card),var(--card)),var(--bg);color:var(--ink2);font-weight:600;z-index:2}
.eltbl thead th.elth{top:0}
.eltbl td.elrn{left:0;min-width:2.5em;text-align:center;z-index:3}
.eltbl thead th.elrn{z-index:4;left:0}
.eltbl td.eltd{white-space:pre-wrap;text-align:left}
.eltbl th.elth{text-align:center}
.eltbl td.elnum{text-align:right;font-variant-numeric:tabular-nums}
.eltbl td.elhi{background:color-mix(in srgb,var(--acc) 18%,var(--card))}
/* «глаз»: суммы спрятаны (Андрей 18.11, образец приложения ВБ — баланс со значком «глаз») */
:root[data-eye="0"] .m{color:transparent!important;background:var(--fill);border-radius:8px;user-select:none}
/* переходы между разделами */
.vin{animation:vin .32s var(--out) backwards}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
/* лёгкий режим: компьютер без видеокарты — без размытия и переходов */
:root[data-lite="1"] .hdr{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
:root[data-lite="1"] *,:root[data-lite="1"] *:before,:root[data-lite="1"] *:after{transition-duration:0s!important;animation-duration:0s!important}
:root[data-lite="1"] .sk{animation:none}
@media (prefers-reduced-motion:reduce){.vin,.sheet.shn .shh .tt,.sheet.shn>.sbody{animation:none}}
@media (max-width:420px){.big{font-size:31px}.tabs button{font-size:14px;gap:5px}.tabs button svg{width:17px;height:17px}.two .v{font-size:18px}.tile .mid{font-size:19px}}
@media (max-width:360px){.tabs button svg{display:none}}
/* 27.11: пятая вкладка «Таблицы» — на телефоне иконка над подписью, чтобы пять влезли */
@media (max-width:600px){.tabs button{flex-direction:column;gap:2px;height:48px;font-size:11.5px;min-width:0;padding:0 2px;position:relative}.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tabs .nb{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;font-size:10px;padding:0 4px}}
@media (max-width:360px){.tabs button{height:40px;font-size:11px}}

/* ───────── 27.11 «как приложение» (Андрей: «должно быть ощущение как приложение, а не таблица перерисованная, куча текста»):
   нижняя панель разделов на телефоне, крупные цифры, списки как в банковском приложении, мало слов. Исходник — src\a_app.css ───────── */
.st{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.st .ok,.st .wr{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-weight:650;border:0;font-family:inherit;font-size:13px;cursor:pointer}
.st .ok{background:var(--good-soft);color:var(--good)}.st .wr{background:var(--warn-soft);color:var(--warn)}
.hero{position:relative;overflow:hidden;border:0;width:100%;text-align:left;font:inherit;color:#fff;cursor:pointer;display:block;
  border-radius:26px;padding:20px 20px 18px;margin-bottom:12px;background:linear-gradient(135deg,#1f6bff 0%,#5b3df5 55%,#9b3df5 100%);box-shadow:0 14px 34px -14px rgba(60,60,240,.55)}
.hero.gr{background:linear-gradient(135deg,#0f9d6b 0%,#13856f 50%,#0b6b7a 100%);box-shadow:0 14px 34px -14px rgba(16,140,110,.5)}
.hero.or{background:linear-gradient(135deg,#ff8a00 0%,#f0592a 60%,#d63c5e 100%);box-shadow:0 14px 34px -14px rgba(240,90,40,.5)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero .hl{font-size:14px;font-weight:600;opacity:.88;display:flex;align-items:center;gap:6px}
.hero .hv{font:800 38px/1.08 var(--fd);letter-spacing:-.03em;margin:6px 0 12px;white-space:nowrap}
.hero .hs{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hs>span{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.hero .chev{width:16px;height:16px;opacity:.8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tl{border:0;background:var(--card);border-radius:20px;box-shadow:var(--sh1);padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:104px;text-decoration:none;min-width:0}
.tl .ti{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px;color:#fff}
.tl .ti svg{width:19px;height:19px}
.tl .tk{font-size:13px;color:var(--ink2);font-weight:600}
.tl .tv{font:750 21px/1.15 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ts{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1{background:#1f6bff}.c2{background:#13a36f}.c3{background:#ff8a00}.c4{background:#e5484d}.c5{background:#8e4ec6}.c6{background:#0ea5b7}.c7{background:#6b7280}.c8{background:#d4a400}.c9{background:#111827}
.sh{display:flex;align-items:baseline;gap:8px;margin:22px 4px 8px}
.sh h3{margin:0;flex:1;font:750 20px/1.2 var(--fd);letter-spacing:-.02em}
.sh a,.sh button{border:0;background:none;color:var(--acc);font:600 14px var(--f);cursor:pointer;padding:0;text-decoration:none}
.gl{background:var(--card);border-radius:20px;box-shadow:var(--sh1);overflow:hidden;margin-bottom:12px}
.sbody .gl{background:var(--card2);box-shadow:none}
.gl>.ri{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:11px 14px;position:relative;text-decoration:none;min-height:58px;box-sizing:border-box}
.gl>.ri.st0{cursor:default}
.gl>.ri+.ri::before{content:"";position:absolute;top:0;right:0;left:64px;border-top:.5px solid var(--line)}
.gl>.ri:active{background:var(--fill2)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 15px var(--fd)}
.av svg{width:20px;height:20px}
.av.sq{border-radius:12px}
.ri .rt{flex:1;min-width:0}
.ri .rt b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .rt span{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ri .rt span.w{color:var(--warn)}
.ri .rv{text-align:right;flex:none;font:650 16px var(--fd);white-space:nowrap}
.ri .rv small{display:block;font:500 12px var(--f);color:var(--ink3);margin-top:1px}
.ri .rv.pl{color:var(--good)}
.ri .chev{width:14px;height:14px;color:var(--ink3);flex:none;margin-left:-4px}
.bar{height:5px;border-radius:9px;background:var(--fill);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);box-shadow:var(--sh1);font:600 14px var(--f);color:var(--ink2);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.srch{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:0 12px;margin-bottom:12px;height:44px}
.srch svg{width:18px;height:18px;color:var(--ink3);flex:none}
.srch input{flex:1;border:0;background:none;font:16px var(--f);color:var(--ink);outline:none;min-width:0}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 16px}
.qa a,.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--f);color:var(--ink2);cursor:pointer;text-decoration:none;padding:0;text-align:center}
.qa .qi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -8px rgba(0,0,0,.45)}
.qa .qi svg{width:25px;height:25px}
.gh{font:700 12.5px var(--f);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:18px 6px 6px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;
  display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(10,108,255,.7);z-index:55;text-decoration:none;cursor:pointer}
.fab svg{width:28px;height:28px}
.emp{text-align:center;color:var(--ink3);padding:26px 10px;font-size:14px}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kv2>div{background:var(--card2);border-radius:16px;padding:12px}
.kv2 .k{font-size:12.5px;color:var(--ink3);font-weight:600}.kv2 .v{font:750 19px var(--fd);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.more{display:block;width:100%;border:0;background:var(--card);border-radius:16px;box-shadow:var(--sh1);padding:13px;font:600 15px var(--f);color:var(--acc);cursor:pointer;margin-bottom:12px}
/* нижняя панель разделов (телефон и узкое окно) */
@media (max-width:899px){
  #tabs.bn{position:fixed;left:0;right:0;bottom:0;z-index:70;margin:0;max-width:none;border-radius:0;gap:0;
    padding:5px 6px calc(env(safe-area-inset-bottom) + 5px);background:var(--hdr);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  #tabs.bn button{flex-direction:column;gap:3px;height:52px;font-size:11px;font-weight:600;border-radius:12px;position:relative}
  #tabs.bn button svg{width:24px;height:24px}
  #tabs.bn button[aria-current="true"]{background:none;box-shadow:none;color:var(--acc)}
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 86px)}
  .hero .hv{font-size:34px}
}
@media (min-width:900px){.fab{bottom:28px}.g2.w4{grid-template-columns:repeat(4,1fr)}#tabs.bn{max-width:1100px}}
:root[data-lite="1"] #tabs.bn{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card)}
/* 27.11 Андрей: «Деньги» — владелец счёта, сортировка, галочка копеек; с копейками строка не ломается */
.denop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 10px}
.denop .chips{margin:0;padding:2px 0 4px;flex:0 1 auto;min-width:0;max-width:100%}
.kopc{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--f);color:var(--ink2);cursor:pointer;user-select:none;padding:6px 2px}
.kopc input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.ri .rt i.vl{font-style:normal;font-weight:600;color:var(--ink2)}
html.kopon .hero .hv{font-size:clamp(24px,8vw,38px)}
html.kopon .ri .rv{font-size:15px}
html.kopon .ri .rt{min-width:0}
.ri .rt i.ownb{font-style:normal;font-weight:600;color:var(--warn)}
/* 27.11 «Отчёты»: ДДС, долг площадок, ведомость — широкая таблица с прокруткой вбок, первый столбец закреплён */
.otw{background:var(--card);border-radius:20px;box-shadow:var(--sh1);overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.sbody .otw{background:var(--card2);box-shadow:none}
.ott{border-collapse:collapse;font:500 13px var(--f);font-variant-numeric:tabular-nums;min-width:100%}
.ott th,.ott td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:.5px solid var(--line)}
.ott th{font-weight:600;color:var(--ink2);position:sticky;top:0;background:var(--card)}
.ott th:first-child,.ott td:first-child{text-align:left;position:sticky;left:0;background:var(--card);max-width:46vw;overflow:hidden;text-overflow:ellipsis;z-index:1}
.sbody .ott th,.sbody .ott td:first-child{background:var(--card2)}
.ott td small{display:block;color:var(--ink2);font-size:11px}
.ott td[data-sh]{cursor:pointer;color:var(--acc)}
.ott tr.vd td{font-weight:700;background:var(--card2)}
.ott tr.gr td{font-weight:600}
.ott tr.ors td:first-child{padding-left:20px}
.ott tr.it td{font-weight:700;border-top:1px solid var(--line)}
.ott .o0{color:var(--line)}
.otsel{display:flex;align-items:center;gap:6px;font:600 14px var(--f);color:var(--ink2)}
.otsel select{font:500 14px var(--f);border:0;border-radius:12px;padding:7px 10px;background:var(--card);box-shadow:var(--sh1);color:var(--ink);max-width:56vw}
</style>
</head>

  solitaire:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#0b2e1e" stroke="#e8c260" stroke-width="1.4"/><rect x="6.2" y="4.6" width="7.6" height="10.8" rx="1.4" fill="#fffdf6" transform="rotate(-8 10 10)"/><path d="M10 13.2c-.6-.6-2.3-1.6-2.3-2.8 0-.9 1.1-1.4 2.3-.4 1.2-1 2.3-.5 2.3.4 0 1.2-1.7 2.2-2.3 2.8Z" fill="#c41230"/></svg>',

  space:'<svg class="sw" viewBox="0 0 20 20"><defs><radialGradient id="swSp" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#7a4fd6"/><stop offset=".55" stop-color="#1c1a5e"/><stop offset="1" stop-color="#060818"/></radialGradient></defs><circle cx="10" cy="10" r="8.6" fill="url(#swSp)" stroke="#a493ff" stroke-width="1.2"/><path d="M3.4 14.6a8.6 8.6 0 0 0 13.2 0c-1.6-1.6-4-2.4-6.6-2.4s-5 .8-6.6 2.4Z" fill="#3fa0e8"/><path d="M3.4 14.6c1.6-1.6 4-2.4 6.6-2.4s5 .8 6.6 2.4" fill="none" stroke="#8ff0ff" stroke-width=".8"/><circle cx="13.6" cy="12.6" r="1.3" fill="#ffd27a"/><circle cx="6" cy="6.4" r=".7" fill="#fff"/><circle cx="12.4" cy="5" r=".5" fill="#fff"/></svg>'};
window.svcPicker=o=>{
  const b=document.querySelector(o.btn);if(!b)return null;
  const w=document.createElement('div');w.className='svt';b.replaceWith(w);w.appendChild(b);b.classList.add('svt-btn');
  b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');
  const m=document.createElement('div');m.className='svt-menu';m.setAttribute('role','menu');m.hidden=true;w.appendChild(m);
  let cur=o.cur;
  const draw=()=>{const it=o.list.find(x=>x[0]===cur)||o.list[0],ic=it[3]||it[0];
    b.innerHTML=(IC[ic]||IC.auto)+'<span>'+it[1]+'</span>';b.title='Тема: '+it[1].toLowerCase();
    let g='';m.innerHTML=o.list.map(([k,n,grp,base])=>((grp||'')!==g?(g=grp||'','<div class="tgrp">'+g+'</div>'):'')+
      '<button type="button" role="menuitemradio" aria-checked="'+(k===cur)+'" data-svt="'+k+'">'+((o.sw&&o.sw[k])||SW[base||k]||SW.auto)+n+'</button>').join('')};
  const show=on=>{m.hidden=!on;b.setAttribute('aria-expanded',on?'true':'false')};
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();show(m.hidden)});
  m.addEventListener('click',e=>{const x=e.target.closest('[data-svt]');if(!x)return;e.stopPropagation();cur=x.dataset.svt;show(false);draw();o.onPick(cur)});
  document.addEventListener('pointerdown',e=>{if(!m.hidden&&!e.target.closest('.svt'))show(false)},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden){show(false);b.focus()}});
  draw();
  return {set(k){cur=k;draw()},close(){show(false)}};
};
/* «назад» на телефоне не выкидывает с сайта (Андрей 29.10: «назад сначала закрывает всплывающее, потом в начало раздела, потом на главную,
   а на главной — наверх; с сайта не выкидывать, и так везде надо»). Над страницей — запас записей-«стражей» {svg:1…20}; каждое «назад»
   тратит одну и делает один шаг. Записи ставим только из касания (отпустил палец, клик, клавиша): добавленные без него Chrome кнопкой
   «назад» пропускает — поэтому не «поставить стража заново после назад», а запас, который доливается при следующем касании.
   svcBack({pop:[шаги страницы: вернуть true, если что-то закрыли], main: перейти в главный раздел (true, если перешли), home: «это главная»}) */
window.svcBack=o=>{
  const q=s=>document.querySelector(s),rs=history.replaceState.bind(history),ps=history.pushState.bind(history),N=20;
  const n=()=>{const s=history.state;return s&&s.svg||0};   // номер стража; 0 — не страж (основа страницы или своя запись страницы)
  let last=n(),gu=location.href;   // gu — адрес текущей записи: страницы меняют в нём раздел (#skleyki) — после «назад» оставляем его
  history.replaceState=function(s,t,u){const k=n();if(k&&!(s&&s.svg))s=Object.assign({},s,{svg:k});rs(s,t,u);if(n())gu=location.href};
  const fill=()=>{try{let k=n();const s=history.state;
    // 17.11 Андрей «при нажатии назад выкидывает в юнитку»: палец после прокрутки (touchend без нажатия) — не касание для Chrome;
    // стражи, поставленные тогда, «назад» пропускал все разом, а настоящее касание их уже не доливало (запас полон) — ставим только при живом касании
    const ua=navigator.userActivation;if(ua&&!ua.isActive)return;
    if(!k){if(s&&!s.svb&&Object.keys(s).length)return;rs(Object.assign({},s,{svb:1}),'')}   // своя запись страницы (карточка Юнитки) — не доливаем
    for(k++;k<=N;k++)ps({svg:k},'',location.href);last=n();gu=location.href}catch(e){}};
  ['click','touchend','keydown'].forEach(k=>document.addEventListener(k,fill,{capture:true,passive:true}));
  const step=()=>{
    for(const f of o.pop||[])if(f())return;                                   // всплывающее страницы: фишки, листы, окна
    if(m.classList.contains('on')){open(false);return}                       // выбор сервиса
    const t=q('.svt-btn[aria-expanded="true"]');if(t){t.click();return}       // выбор темы
    const big=q('#sxCard.big [data-sx="big"],#ptCard.big [data-pt="big"],#abCard.big [data-ab="big"],#spCard.big [data-sp="big"]');if(big){big.click();return}
    const g=q('#sxCard.flip [data-sx="back"],#ptCard.flip [data-pt="back"],#abCard.flip [data-ab="back"]');if(g){g.click();return}   // игра — обратно на баннер
    if(scrollY>40){scrollTo({top:0,behavior:'smooth'});return}              // в начало раздела
    if(o.main&&o.main())return;                                               // на главный раздел
    if(o.home)o.home();                                                       // уже на главной, наверху
  };
  addEventListener('popstate',()=>{const k=n(),s=history.state;
    // «назад» — номер стража стал меньше (с записи страницы на стража того же номера — это её собственный «назад», не наш);
    // основа страницы — запас кончился, шаг всё равно делаем
    if(k?k<last:!!(s&&s.svb)){const was=location.href;step();if(location.href===was)try{rs(history.state,'',gu)}catch(x){}}   // шаг не сменил раздел — адрес оставляем прежний
    last=k;gu=location.href});
};

/* ───────── общие таблицы — взяты из «Рекламы» (reklama_wb\src\d_tabl.js, 18.11) как есть, без её разделов:

/* перетаскивание строки в листе «Столбцы»: палец — подержать ~0,2 с и тянуть, за ⠿ — сразу; мышь — сразу */
function colDrag(id,ap){$$('#sbody .colr[data-ck]').forEach(r=>{if(!r.querySelector('[data-drag]'))return;
  r.onpointerdown=e=>{if(e.button>0||e.target.closest('.sw,select'))return;e.stopPropagation();
    const sc=$('#sbody'),onH=!!e.target.closest('[data-drag]'),ms=e.pointerType==='mouse',sx=e.clientX,sy=e.clientY,DOC=document;let y0=sy,ly=sy,tm=0,act=false,hold=0;
    const glide=(el,fn)=>{const t1=el.getBoundingClientRect().top;fn();const t2=el.getBoundingClientRect().top;if(Math.abs(t1-t2)<1)return;
      el.style.transition='none';el.style.transform=`translateY(${t1-t2}px)`;el.getBoundingClientRect();el.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';el.style.transform='';
      setTimeout(()=>{if(!el.classList.contains('drg'))el.style.transition=''},220)};
    const step=()=>{const dy=ly-y0;r.style.transform=`translateY(${dy}px)`;
      const nx=r.nextElementSibling,pv=r.previousElementSibling;
      if(nx&&nx.dataset&&nx.dataset.ck&&dy>nx.offsetHeight/2){const hh=nx.offsetHeight;glide(nx,()=>nx.after(r));y0+=hh;r.style.transform=`translateY(${ly-y0}px)`}
      else if(pv&&pv.querySelector&&pv.querySelector('[data-drag]')&&dy<-pv.offsetHeight/2){const hh=pv.offsetHeight;glide(pv,()=>pv.before(r));y0-=hh;r.style.transform=`translateY(${ly-y0}px)`}};
    const edge=()=>{if(!sc||!act){tm=0;return}const b=sc.getBoundingClientRect(),d=ly<b.top+60?-9:ly>b.bottom-60?9:0;if(d){const t0=sc.scrollTop;sc.scrollTop+=d;y0-=sc.scrollTop-t0;step()}tm=d?requestAnimationFrame(edge):0};
    const tb=ev=>{if(act&&ev.cancelable)ev.preventDefault()};
    const start=()=>{if(act)return;act=true;hold=0;try{r.setPointerCapture(e.pointerId)}catch(x){}r.classList.add('drg');if(!ms&&navigator.vibrate)try{navigator.vibrate(12)}catch(x){}};
    const off=()=>{['pointermove','pointerup','pointercancel'].forEach((n,k)=>DOC.removeEventListener(n,[mv,up,up][k]));DOC.removeEventListener('touchmove',tb,{passive:false})};
    const end=skip=>{clearTimeout(hold);off();if(tm)cancelAnimationFrame(tm);tm=0;if(!act)return;act=false;
      r.classList.remove('drg');const dy=parseFloat((r.style.transform.match(/-?[\d.]+/)||[0])[0])||0;r.style.transition='none';r.style.transform=`translateY(${dy}px)`;r.getBoundingClientRect();
      r.style.transition='transform .16s ease-out';r.style.transform='';
      setTimeout(()=>{r.style.transition='';if(skip)return;const z=tblSt(id),o=[...r.parentNode.querySelectorAll('.colr[data-ck]')].map(x=>x.dataset.ck);
        if(o.join()!==z.ord.join()&&o.length===z.ord.length){z.ord=o;tblSave(id,z);ap()}},170)};
    const mv=ev=>{ly=ev.clientY;if(!act){const d=Math.hypot(ev.clientX-sx,ev.clientY-sy);if(ms&&d>3)start();else if(!ms&&d>8){end(true);return}else return}
      if(ev.cancelable)ev.preventDefault();step();if(!tm)edge()};
    const up=()=>end(false);
    DOC.addEventListener('pointermove',mv,{passive:false});DOC.addEventListener('pointerup',up);DOC.addEventListener('pointercancel',up);
    DOC.addEventListener('touchmove',tb,{passive:false});
    if(onH){e.preventDefault();start()}else if(!ms)hold=setTimeout(start,200)}})}
function openCols(id){sheet(()=>{const st=tblSt(id),T0=TBL[id];
  const row=(k,i)=>{const c=T0.cols.find(x=>x.k===k),on=!st.hid.has(k);
    return `<div class="opt colr" data-ck="${k}">${i===0?'<i class="dh dh0"></i>':'<i class="dh" data-drag aria-label="Перетащить">⠿</i>'}<div><b>${c.l}${c.sub?' · '+c.sub:''}</b>${c.t?`<span>${esc(c.t)}</span>`:''}</div>${i===0?'<span class="muted" style="font-size:12px;flex:none">всегда первый</span>'
      :`<button class="sw" type="button" role="switch" data-colsw="${k}" aria-checked="${on}" aria-label="${c.l}"></button>`}</div>`};
  const opts=cur=>T0.cols.map(c=>`<option value="${c.k}"${c.k===cur?' selected':''}>${esc(String(c.l+(c.sub?' '+c.sub:'')).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}</option>`).join('');
  const dirB=(n,d)=>`<button class="mvb press" type="button" data-sdir="${n}" aria-label="${d<0?'По убыванию':'По возрастанию'}" title="${d<0?'по убыванию':'по возрастанию'}">${d<0?'↓':'↑'}</button>`;
  const srt=`<div class="hrw" style="margin-top:2px"><h3>Сортировка</h3></div>
    <div class="opt colr"><div><b>Сначала по</b><span>основной столбец</span></div><select class="ssel" id="sso1" aria-label="Основной столбец сортировки">${opts(st.sort)}</select>${dirB(1,st.dir)}</div>
    <div class="hrw"><h3>Столбцы</h3></div>`;
  return {t:'Столбцы и сортировка',s:'что показывать, в каком порядке и как сортировать · запоминается на этом устройстве',h:srt+st.ord.map(row).join('')
    +'<div class="acts"><button class="btn gray press" type="button" id="colrs">Как было сначала</button><button class="btn press" type="button" data-act="close">Готово</button></div>'
    +'<div class="muted tnote">В самой таблице: нажмите на название столбца — сортировка по нему; прежний столбец остаётся вторым (цифры 1 и 2 в шапке).</div>',
    after:()=>{const ap=()=>{redraw();render(true)};
      $$('[data-colsw]').forEach(b=>b.onclick=()=>{const s2=tblSt(id),k=b.dataset.colsw;if(s2.hid.has(k))s2.hid.delete(k);else s2.hid.add(k);tblSave(id,s2);ap()});
      colDrag(id,ap);
      const rs=$('#colrs');if(rs)rs.onclick=()=>{RS.del('tb.'+id);ap()};
      const s1=$('#sso1');
      if(s1)s1.onchange=()=>{const z=tblSt(id),c=T0.cols.find(x=>x.k===s1.value);if(!c)return;if(z.sort2===c.k)z.sort2=null;z.sort=c.k;z.dir=c.asc?1:-1;tblSave(id,z);ap()};
      $$('[data-sdir]').forEach(b=>b.onclick=()=>{const z=tblSt(id);z.dir=-z.dir;tblSave(id,z);ap()})}}},true)}
/* плавная пересортировка: до перерисовки запомнить, где была каждая строка таблицы id, после — довести строки с прежнего места на новое */
function tblFlip(id,fn){const key=r=>r.dataset.row||'',pos=new Map();
  document.querySelectorAll(`[data-tbl="${id}"] tbody tr`).forEach((r,i)=>{const k=key(r);if(k&&i<400)pos.set(k,r.getBoundingClientRect().top)});
  fn();if(!pos.size||matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.dataset.lite==='1')return;
  document.querySelectorAll(`[data-tbl="${id}"] tbody tr`).forEach(r=>{const p=pos.get(key(r));if(p==null)return;const d=p-r.getBoundingClientRect().top;if(Math.abs(d)<1)return;
    r.style.transition='none';r.style.transform=`translateY(${d}px)`;r.getBoundingClientRect();r.style.transition='transform .32s cubic-bezier(.2,.8,.2,1)';r.style.transform='';
    setTimeout(()=>{r.style.transition=''},360)})}
/* шапка столбцов остаётся на месте: таблица не выше экрана под шапкой сайта и листается внутри себя */
function twFit(){const hd=$('.hdr');if(!hd)return;document.documentElement.style.setProperty('--twh',Math.max(300,innerHeight-hd.getBoundingClientRect().height-24)+'px')}

   «Все счета»: остаток — «свои деньги» после операции (те же счета, что «Свои сейчас»; snimok.py lenta); один счёт — остаток этого счёта ── */
function vlS(o,sid){if(o.g==='income')return o.s1===sid?o.kop:0;if(o.g==='outcome')return o.s1===sid?-o.kop:0;
  return (o.s1===sid?-o.kop:0)+(o.s2===sid?(o.kop2!=null?o.kop2:o.kop):0)}
function lentaRows(k){const L=D.lenta;k=k||S.len;
  if(k==='vse'||!L.po[k])return L.vse.map(([id,ost,dl])=>({id,o:L.ops[id],ost,dl,vse:1}));
  const sid=+k;return L.po[k].map(id=>{const o=L.ops[id];return {id,o,ost:o.s1===sid?o.o1:o.o2,dl:vlS(o,sid),vse:0}})}
function lenRow(x){const o=x.o,opis=o.na||o.st||o.ka||GN[o.g],sc=o.s2?snm(o.s1)+' → '+snm(o.s2):snm(o.s1);
  const amt=x.dl?`<span class="${x.dl>0?'good':''}">${x.dl>0?'+':'−'}${M(Math.abs(x.dl),R0k)}</span>`
    :`<span class="s2" title="${x.vse?'«свои» не меняет':''}">${o.g==='transfer'?'⇄ ':o.g==='income'?'+':'−'}${M(o.kop,R0k)}</span>`;
  return `<button class="lr" type="button" data-act="op" data-id="${x.id}" data-row="o:${x.id}"><span class="l1"><span class="lo">${esc(opis)}</span><span class="la">${amt}</span></span>`
    +`<span class="l2"><span class="lm">${o.chat?'<i class="chat" title="из чата «Чеки АА», в Финтабло ещё нет">из чата</i> ':''}${o.svoya?`<i class="chat" title="${esc(o.ist)}">${/не отправляли/.test(o.ist)?'только в «Учёте»':'из «Ввода»'}</i> `:''}${dm(o.d)}${o.vr&&o.vr!=='00:00'?' '+o.vr:''} · ${esc(sc)}${o.st&&o.st!==opis?' · '+esc(o.st):''}</span>`
    +`<span class="lb">${x.vse?'свои':'ост.'} <b data-k="lo" data-v="${x.ost==null?'':x.ost}">${x.ost==null?'—':M(x.ost)}</b></span></span></button>`}
function lentaSel(){const L=D.lenta,grp=[['Свои',s=>s.svoi],['Кредитные',s=>s.gr==='kreditnye'],['Прочие',s=>!s.svoi&&s.gr!=='kreditnye']];
  const sc=D.scheta.filter(s=>L.po[s.id]);
  return `<select class="ssel" id="lenS" aria-label="Счёт ленты"><option value="vse"${S.len==='vse'?' selected':''}>Все счета</option>`
    +grp.map(([g,f])=>{const a=sc.filter(f).sort((x,y)=>x.n.localeCompare(y.n,'ru'));return a.length?`<optgroup label="${g}">${a.map(s=>`<option value="${s.id}"${String(s.id)===S.len?' selected':''}>${esc(s.n)}</option>`).join('')}</optgroup>`:''}).join('')+'</select>'}

/* ── «Свободно»: главная цифра — если ничего не придёт; вторая — с приходами календаря ── */
const svobH=(c,big)=>`<div class="${big?'big':'v'} ${c.svob7<0?'bad':'good'}">${Mk('svob7',c.svob7)}</div>`
  +`<div class="note"><b>если ничего не придёт</b> · с приходами календаря ${M(c.o7.prihod,kk)}: <b class="${c.svob7p<0?'bad':''}">${Mk('svob7p',c.svob7p)}</b></div>`;

/* ── «Сегодня»: четыре плитки и «Купили и оплатили сегодня» ── */

    <div class="big">${Mk('svoi',c.svoi)}</div>
    <div class="row2"><div><div class="k">Свободно на 7 дней</div>${svobH(c,false)}</div>

  h+=`<a class="card tile press" href="vvod/" style="text-decoration:none;color:inherit"><div class="cap">Ввод операций ${CHEV}</div><div class="note">операции и «Разобрать» · статус на странице</div></a>`;

    `<button type="button" data-nt="${i}"><i class="ic ${x.vid==='scheta'||x.vid==='vb'?'warn':'bad'}">!</i><div class="t"><b>${esc(x.t)}</b>${x.d?`<span>${esc(x.d)}</span>`:''}</div>${CHEV}</button>`).join('')+'</div>'
    :'<div class="empty1"><i class="ic">✓</i>Сверки сошлись, ночные задачи прошли, молчащих счетов нет</div>')+'</div>';
  h+='</div>';
  const pr=zk.filter(z=>z.vid==='priemka'),pl=zk.filter(z=>z.vid==='platezh'),sm=a=>a.reduce((s,z)=>s+z.kop,0);
  h+=`<div class="hrw"><h3>Купили и оплатили сегодня</h3>${zk.length?`<span class="muted">приёмки ${M(sm(pr),kk)} · платежи ${M(sm(pl),kk)}</span>`:''}</div>`
    +`<div class="card" id="cZak">${zk.length?'<div class="dl">'+zk.map(z=>`<div class="zr"><div class="t"><b>${esc(z.post)}</b><span>${z.vid==='priemka'
      ?'приёмка № '+esc(z.nomer)+' · <span class="bdg '+PST[z.st][0]+'">'+PST[z.st][1]+'</span>':'платёж поставщику № '+esc(z.nomer)+(z.na?' · '+esc(z.na):'')}</span></div><div class="v">${M(z.kop)}</div></div>`).join('')+'</div>'
      :'<div class="empty1 nl"><i class="ic">·</i>сегодня закупок нет</div>'}<div class="ist">по МойСкладу · банк не подтверждал</div></div>`;
  return h}

/* ── «Деньги на сейчас» ── */
function vDenOld(){const c=calc(),dl=D.dolgi,kal=D.kal;let h=fresh();
  h+=`<button class="card press" type="button" data-sh="svoi" id="cSvoi"><div class="cap">Свои сейчас ${CHEV}</div><div class="big">${Mk('svoi',c.svoi)}</div>

      <div><div class="k">30 дней · по ${dm(c.o30.po)}</div><div class="v">${Mk('ob30',c.o30.plat)}</div><div class="s">${c.o30.np} ${mn(c.o30.np,'платёж','платежа','платежей')}</div></div></div>

    <div class="ist">${esc(TX('kal'))}</div></button>`;
  h+=`<button class="card press${c.svob7<0?' neg':''}" type="button" data-sh="svob" id="cSvob"><div class="cap">Свободно на 7 дней ${CHEV}</div>${svobH(c,true)}
    <div class="note">на 30 дней: <b class="${c.svob30<0?'bad':''}">${Mk('svob30',c.svob30)}</b> · с приходами ${M(c.o30.prihod,kk)}: <b class="${c.svob30p<0?'bad':''}">${Mk('svob30p',c.svob30p)}</b></div>
    <div class="note">порог ${M(c.porog)} — ${esc(TX('porog'))}${c.porog!==POROG0()?' · изменён на этом устройстве':''}. Нажмите — формула с цифрами.</div></button>`;
  const zpm=dl.zp.mes?MESI[+dl.zp.mes.slice(5,7)-1]:'';

    <button type="button" data-sh="ff"><div class="t"><b>Фулфилментам</b><span>${dl.ff.n} ${mn(dl.ff.n,'акт','акта','актов')} «Требует оплаты» минус оплаты по ним</span></div><div class="v">${Mk('dff',dl.ff.kop)}</div>${CHEV}</button>
    ${dl.proc?`<button type="button" data-sh="proc"><div class="t"><b>Проценты по кредитам</b><span>начислено в «Учёте» − выплачено${dl.proc.bez_kredita_kop?' · без кредита '+M(dl.proc.bez_kredita_kop,kk):''}</span></div><div class="v">${Mk('dproc',dl.proc.kop)}</div>${CHEV}</button>`:''}
    <button type="button" data-sh="zp"><div class="t"><b>Зарплата</b><span>ведомость Финтабло за ${zpm} (месяц идёт)${dl.zp.pere_kop?' · переплата '+M(dl.zp.pere_kop,kk):''}</span></div><div class="v">${Mk('dzp',dl.zp.kop)}</div>${CHEV}</button>
    </div><div class="note">В «Обещано» и «Свободно» не входят — чтобы не посчитать дважды с календарём.</div></div>`;
  h+=`<div class="line static small" id="cPl"><div class="t"><b>На площадках к выводу</b><span>появится на этапе 1</span></div></div>`;
  h+=`<button class="line small press" type="button" data-sh="kred" id="cKred"><div class="t"><b>Кредитки: лимит свободен</b><span>${sch(c.kred.n)} · в сумму не входит никогда</span></div><div class="v s2">${Mk('kred',c.kred.kop)}</div>${CHEV}</button>`;

    +`<div class="tnote">${S.len==='vse'?'«Свои» — сколько своих денег осталось после операции. Перевод между своими и операции по кредиткам их не меняют; с кредитки на свой счёт — плюс, со своего на кредитку — минус.':'Остаток счёта сразу после операции — как считает Финтабло.'} Последние ${LR.length} ${mn(LR.length,'операция','операции','операций')}.</div>`;

    +`<div class="tnote">Оплачено или в долг — по МойСкладу, банк этого не подтверждал. Не оплачено полностью: ${vd.length} на ${M(vd.reduce((z,p)=>z+p.kop-p.opl,0))}.</div>`;

/* ── листы ── */

/* 28.11 «Остатки на дату» (snimok_sklad.na_datu): штуки — остаток «на сейчас» минус изменения после выбранного дня;

const ndOk=()=>{const N=D.skl&&D.skl.nd;return N&&!N.err&&N.kon&&N.kon.length?N:null};

  if(N.me[d])return {d,rows:N.me[d].map(r=>r.slice()),tochno:1};
  const n=ndDen(N,d),q=new Map(),kk=(t,s)=>t+'|'+s;
  for(const [t,s,k] of K.ost)q.set(kk(t,s),(q.get(kk(t,s))||0)+k);

  const baza=N.kon.find(x=>x<=d),src=baza?N.me[baza].map(r=>[r[0],r[1],r[2],r[3]]):K.ost.map(r=>[r[0],r[1],r[2],r[3]]);
  const ed=new Map(),edT=new Map();for(const [t,s,k,kop] of src)if(k>0&&kop>0){ed.set(kk(t,s),kop/k);if(!edT.has(t))edT.set(t,kop/k)}
  const edN=new Map();for(const [t,,k,kop] of K.ost)if(k>0&&kop>0&&!edN.has(t))edN.set(t,kop/k);
  let bez=0;const rows=[];
  for(const [key,k] of q){if(Math.abs(k)<1e-9)continue;const [t,s]=key.split('|').map(Number);
    const e=ed.get(key)??edT.get(t)??edN.get(t);if(e==null)bez++;rows.push([t,s,Math.round(k*1000)/1000,e==null?0:Math.round(k*e)])}

  const own=L.filter(x=>!(K.sk[x.s]||{}).pl).sort((a,b)=>b.kop-a.kop),mp=L.filter(x=>(K.sk[x.s]||{}).pl).sort((a,b)=>b.kop-a.kop),sm=a=>a.reduce((z,x)=>z+x.kop,0);

const OTV=[['dds','ДДС'],['fb','ФТ ↔ банк'],['pr','Прибыльность'],['vz','Взаиморасчёты'],['dz','Долг площадок'],['sv','Самовыкупы'],['zp','Зарплата']];

/* ── ДДС: фильтры — владелец счёта (как «Деньги»), счёт, вид деятельности ── */
function ddsSchOk(i){const s=OT.dds.sch[i];if(!s)return false;if(S.ots!=null&&S.ots!=='')return String(i)===String(S.ots);

/* агрегат: статья → месяц → сумма; ключ статьи -1 — «без статьи» */
function ddsAgg(){const A=new Map(),R=ddsRows();for(const r of R){const k=r[3],m=r[0].slice(0,7);let x=A.get(k);if(!x){x={};A.set(k,x)}x[m]=(x[m]||0)+r[1]}return A}
function vDds(){const d=OT.dds,ML=otMesyacy(),ST=d.st,A=ddsAgg(),vdS=S.otvd||'vse';let h='';

  const R=ddsRows(),pri=R.filter(r=>r[1]>0).reduce((z,r)=>z+r[1],0),ras=R.filter(r=>r[1]<0).reduce((z,r)=>z+r[1],0);
  h+=`<div class="hero" id="hDds"><div class="hl">Чистый поток с ${dm(d.ot)} · ${R.length} ${mn(R.length,'операция','операции','операций')}</div><div class="hv"><span class="m" data-k="ddsit" data-v="${pri+ras}">${rub(pri+ras)}</span></div>`

  if((S.otdv||'st')==='sch')return h+ddsSch(ML);

  if(S.otdv==='dn')return h+ddsDn(ML);
  /* по статьям: вид деятельности → поступления / выплаты → статьи; итог строки и столбца */
  const VDL=vdS==='vse'?['operating','investment','financial']:[vdS];
  let t='<div class="otw"><table class="ott" id="tDds"><thead><tr><th>Статья</th>'+ML.map(m=>`<th>${otMs(m)}</th>`).join('')+'<th>Итого</th></tr></thead><tbody>';
  const sumM=(keys,m)=>keys.reduce((z,k)=>z+((A.get(k)||{})[m]||0),0),sumA=keys=>ML.reduce((z,m)=>z+sumM(keys,m),0);
  const row=(n,keys,cls,sh)=>`<tr class="${cls||''}"><td>${n}</td>`+ML.map(m=>{const v=sumM(keys,m);return `<td${v&&sh?` data-sh="otd:${sh}|${m}"`:''}>${otN(v)}</td>`}).join('')+`<td${sumA(keys)&&sh?` data-sh="otd:${sh}|"`:''}>${otN(sumA(keys))}</td></tr>`;
  let vsego=[];
  for(const vd of VDL){const K=[...A.keys()].filter(k=>(ST[k]||{vd:'operating'}).vd===vd);if(!K.length)continue;vsego=vsego.concat(K);

/* 27.11 (собрание): разрез по контрагентам / направлениям — строки, месяцы — столбцы; провал в операции */
function ddsGr(ML,v){const d=OT.dds,R=ddsRows(),j=v==='ka'?4:5,IM=v==='ka'?d.ka:d.napr,A=new Map();
  for(const r of R){const k=r[j],m=r[0].slice(0,7);let x=A.get(k);if(!x){x={t:0};A.set(k,x)}x[m]=(x[m]||0)+r[1];x.t+=r[1]}
  const K=[...A.keys()].sort((a,b)=>Math.abs(A.get(b).t)-Math.abs(A.get(a).t)),N=80,V=K.slice(0,N),P=K.slice(N);
  const nz=k=>k>=0?esc(IM[k]||'?'):(v==='ka'?'Без контрагента':'Без направления'),pf=v==='ka'?'k':'n';
  let t=`<div class="otw"><table class="ott" id="tDdsGr"><thead><tr><th>${v==='ka'?'Контрагент':'Направление'}</th>`+ML.map(m=>`<th>${otMs(m)}</th>`).join('')+'<th>Итого</th></tr></thead><tbody>';

  if(P.length){const x={t:0};for(const k of P){const y=A.get(k);x.t+=y.t;ML.forEach(m=>x[m]=(x[m]||0)+(y[m]||0))}tot.t+=x.t;
    t+=`<tr class="ors"><td>Прочие (${P.length})</td>`+ML.map(m=>{tot[m]=(tot[m]||0)+(x[m]||0);return `<td>${otN(x[m]||0)}</td>`}).join('')+`<td>${otN(x.t)}</td></tr>`}

function ddsDn(ML){const R=ddsRows();if(!ML.includes(S.otdm))S.otdm=ML[ML.length-1];const m=S.otdm,A=new Map();
  for(const r of R){if(r[0].slice(0,7)!==m)continue;let x=A.get(r[0]);if(!x){x={p:0,v:0};A.set(r[0],x)}if(r[1]>0)x.p+=r[1];else x.v+=r[1]}
  const DN=[...A.keys()].sort().reverse();let tp=0,tv=0;

    +'<div class="otw"><table class="ott" id="tDdsDn"><thead><tr><th>День</th><th>Поступления</th><th>Выплаты</th><th>Чистый поток</th></tr></thead><tbody>';

/* по счетам: остаток на начало года, движение по месяцам (с переводами), остаток сейчас */
function ddsSch(ML){const d=OT.dds,SC=d.sch.map((s,i)=>({...s,i})).filter(s=>ddsSchOk(s.i)&&!s.arh);
  const dv=new Map();const add=(i,m,v)=>{let x=dv.get(i);if(!x){x={};dv.set(i,x)}x[m]=(x[m]||0)+v};

  return t+`<div class="note">Остаток на начало года — остаток Финтабло сейчас минус операции с ${dmy(d.ot)}. В месяцах — движение счёта с переводами. Нажмите сумму — операции.</div>`}
/* лист операций: статья / вид / группа / всё × месяц (или весь период) */
function shOtd(k){const [key,m]=k.split('|'),d=OT.dds,ST=d.st;let R=ddsRows(),nz='';

  else if(key[0]==='g'){const [vd,g]=key.slice(1).split('.');R=R.filter(r=>(ST[r[3]]||{vd:'operating'}).vd===vd&&(r[3]>=0?ST[r[3]].g===g:g==='outcome'));nz=d.vd[vd]+' · '+(g==='income'?'поступления':'выплаты')}

  else{const s=+key.slice(1);R=R.filter(r=>r[3]===s);nz=s>=0?ST[s].n:'Без статьи'}
  if(m)R=R.filter(r=>r[0].slice(0,m.length)===m);
  return otOps(R.map(r=>({d:r[0],kop:r[1],s:d.sch[r[2]],ka:d.ka[r[4]],na:r[6],st:ST[r[3]],np:d.napr[r[5]]})),esc(nz),(m?(m.length>7?dmy(m):otM(m)):'с '+dm(d.ot))+' · по Финтабло')}
function shOts(k){const [i,m]=k.split('|').map((x,j)=>j?x:+x),d=OT.dds,s=d.sch[i];if(!s)return null;
  const L=d.r.filter(r=>r[2]===i&&r[0].slice(0,7)===m).map(r=>({d:r[0],kop:r[1],s,ka:d.ka[r[4]],na:r[6],st:d.st[r[3]]}))
    .concat(d.per.filter(p=>(p[2]===i||p[3]===i)&&p[0].slice(0,7)===m).map(p=>({d:p[0],kop:p[2]===i?-p[1]:p[4],s,na:p[5],per:p[2]===i?'→ '+nmS((d.sch[p[3]]||{}).n||'?'):'← '+nmS((d.sch[p[2]]||{}).n||'?')})));
  return otOps(L,esc(nmS(s.n)),otM(m)+' · с переводами')}
function otOps(L,t,s){L.sort((a,b)=>b.d.localeCompare(a.d)||a.kop-b.kop);const pri=L.filter(x=>x.kop>0).reduce((z,x)=>z+x.kop,0),ras=L.filter(x=>x.kop<0).reduce((z,x)=>z+x.kop,0);

  return {t,s:s+' · '+L.length+' '+mn(L.length,'операция','операции','операций'),h:`<div class="kv2"><div><div class="k">Поступления</div><div class="v">${M(pri,rub)}</div></div><div><div class="k">Выплаты</div><div class="v">${M(Math.abs(ras),rub)}</div></div></div>`
    +'<div class="gl">'+V.map(x=>riA({st0:1,t:esc(x.na||(x.ka)||(x.st&&x.st.n)||'—'),s:dm(x.d)+' · '+esc(nmS((x.s||{}).n||''))+(x.per?' '+esc(x.per):'')+(x.ka&&x.na?' · '+esc(x.ka):'')+(x.st&&!x.per?' · '+esc(x.st.n):'')+(x.np?' · '+esc(x.np):''),
      v:`<span class="${x.kop>0?'good':''}">${x.kop>0?'+':'−'}${rub(Math.abs(x.kop))}</span>`})).join('')+'</div>'
